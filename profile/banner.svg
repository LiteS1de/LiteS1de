<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300">
  <defs>
    <radialGradient id="bg" cx="0.75" cy="0.4" r="0.95">
      <stop offset="0" stop-color="#3a2614"/>
      <stop offset="0.55" stop-color="#1a120b"/>
      <stop offset="1" stop-color="#0c0906"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFA727" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFA727" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="egg" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.6" stop-color="#f3d9b6"/>
      <stop offset="1" stop-color="#c9935f"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#c66a12"/>
      <stop offset="1" stop-color="#FFC861"/>
    </linearGradient>
    <style>
      .b { transform-box: fill-box; transform-origin: 50% 100%; animation: eq 1.6s ease-in-out infinite alternate; }
      @keyframes eq { 0% { transform: scaleY(0.25); } 100% { transform: scaleY(1); } }
      .egg { transform-box: fill-box; transform-origin: 50% 100%; animation: bob 2.4s ease-in-out infinite alternate; }
      @keyframes bob { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }
      @media (prefers-reduced-motion: reduce) { .b, .egg { animation: none; } }
    </style>
  </defs>

  <rect width="1280" height="300" rx="24" fill="url(#bg)"/>
  <circle cx="1010" cy="170" r="240" fill="url(#glow)"/>

  <text x="80" y="140" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="92" font-weight="800" fill="#FFA727" letter-spacing="1">LiteS1de</text>
  <text x="84" y="192" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="600" fill="#e8dcc8">game modder · music producer · DJ</text>
  <text x="84" y="236" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" fill="#a89580">C# · Unity · BepInEx · Python · TypeScript · FL Studio</text>

  <!-- equalizer: the music half -->
  <g fill="url(#bar)">
    <rect class="b" x="820" y="96"  width="18" height="150" rx="6" style="animation-delay:-0.2s"/>
    <rect class="b" x="848" y="126" width="18" height="120" rx="6" style="animation-delay:-1.1s"/>
    <rect class="b" x="876" y="76"  width="18" height="170" rx="6" style="animation-delay:-0.6s"/>
    <rect class="b" x="904" y="136" width="18" height="110" rx="6" style="animation-delay:-1.4s"/>
    <rect class="b" x="932" y="106" width="18" height="140" rx="6" style="animation-delay:-0.9s"/>
    <rect class="b" x="960" y="146" width="18" height="100" rx="6" style="animation-delay:-0.3s"/>
    <rect class="b" x="988" y="116" width="18" height="130" rx="6" style="animation-delay:-1.3s"/>
  </g>

  <!-- the egg: the modding half -->
  <ellipse cx="1118" cy="252" rx="54" ry="11" fill="url(#shadow)"/>
  <g class="egg">
    <path transform="translate(1118 186) scale(1.25)" d="M0,-50 C26,-50 40,-14 40,10 C40,36 22,50 0,50 C-22,50 -40,36 -40,10 C-40,-14 -26,-50 0,-50 Z" fill="url(#egg)"/>
  </g>
</svg>
