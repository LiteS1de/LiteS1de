name: Update profile cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile.yml"]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GITHUB_TOKEN sees public repos only, so private projects never show up in the card.
      - name: Top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide=powershell,batchfile,html&hide_border=true&bg_color=1f1f24&title_color=ff6b6b&text_color=e6e6e6&custom_title=Languages
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Featured repo card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=egging-on-coop&hide_border=true&bg_color=1f1f24&title_color=ff6b6b&text_color=e6e6e6&icon_color=ffb88c&description_lines_count=3
          path: profile/pin-egging-on-coop.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile cards" || exit 0
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ff6b6b&color_dots=#ebedf0,#ffe0d6,#ffb88c,#ff8a7a,#ff6b6b
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffb88c&color_dots=#161b22,#4a2530,#7a3340,#c2505a,#ff6b6b

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
